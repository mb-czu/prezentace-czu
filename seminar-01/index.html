<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Řízení IT projektů – 1. cvičení</title>

  <!-- Reveal.js -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/reveal.js@5.2.1/dist/reveal.css">

  <!-- Společné téma ČZU -->
  <link rel="stylesheet" href="../template/czu-theme.css">
</head>

<body>
  <div class="reveal">
    <div class="slides" id="slides"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.2.1/dist/reveal.js"></script>

  <script>
    const files = [
      "slides/00-title.html",
      "slides/01-agenda.html",
      "slides/02-introduction.html",
      "slides/03-introduction.html",
    ];

    async function loadSlides() {
      const container = document.querySelector("#slides");

      const responses = await Promise.all(
        files.map(file => fetch(file))
      );

      for (const response of responses) {
        if (!response.ok) {
          throw new Error(`Nepodařilo se načíst ${response.url}`);
        }
      }

      const html = await Promise.all(
        responses.map(response => response.text())
      );

      container.innerHTML = html.join("\n");

      await Reveal.initialize({
        hash: true,
        slideNumber: true,
        width: 1920,
        height: 1080,
        margin: 0,
        minScale: 0.2,
        maxScale: 2
      });
    }

    loadSlides().catch(console.error);
  </script>
</body>
</html>
